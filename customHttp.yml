# AWS Amplify Hosting custom HTTP headers.
# https://docs.aws.amazon.com/amplify/latest/userguide/custom-headers.html
customHeaders:
  # Hashed, content-addressed build output can be cached forever.
  - pattern: "/assets/**"
    headers:
      - key: "Cache-Control"
        value: "public, max-age=31536000, immutable"

  # Security headers on every response. (index.html is left on Amplify's
  # default short cache so SPA deploys are picked up immediately.)
  - pattern: "**"
    headers:
      - key: "X-Content-Type-Options"
        value: "nosniff"
      - key: "X-Frame-Options"
        value: "SAMEORIGIN"
      - key: "Referrer-Policy"
        value: "strict-origin-when-cross-origin"
      - key: "Strict-Transport-Security"
        value: "max-age=31536000; includeSubDomains"
      - key: "Permissions-Policy"
        value: "geolocation=(), microphone=(), camera=()"
      # Start in report-only; review violations, then switch the key to
      # "Content-Security-Policy" to enforce.
      - key: "Content-Security-Policy-Report-Only"
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://widget.letsumai.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; media-src 'self'; frame-src https://www.google.com https://www.openstreetmap.org https://www.googletagmanager.com https://widget.letsumai.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://connect.facebook.net https://*.letsumai.com; base-uri 'self'"
